name: Build Packages V2 (Staged)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        required: true
        default: "aarch64"
        type: choice
        options:
          - aarch64

      stage1_packages:
        description: "Stage 1 packages (foundation, built from source)"
        required: true
        default: "zlib openssl ca-certificates"

      stage2_packages:
        description: "Stage 2 packages (use -I from hosted repo)"
        required: true
        default: "bash coreutils grep sed tar apt"

permissions:
  contents: write

jobs:
  stage1:
    name: Stage 1 - Foundation packages
    runs-on: ubuntu-26.04

    container:
      image: ghcr.io/termux/package-builder:latest
      options: --privileged --device /dev/fuse

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build stage 1
        run: |
          bash build.sh -a "${{ inputs.arch }}" -e ${{ inputs.stage1_packages }}

      - name: Generate APT repository
        run: |
          export AURASTUDIO_OUTPUT_DIR="$(pwd)/output"
          export AURASTUDIO_REPO_DIR="$(pwd)/output/repo"
          bash ./generate-apt-repo.sh

      - name: Import GPG key
        run: |
          if [ -n "${PACKAGES_GPG_KEY:-}" ]; then
            echo "$PACKAGES_GPG_KEY" | base64 -d | gpg --batch --import
          else
            echo "No GPG key configured, skipping signing"
          fi
        env:
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}

      - name: Sign repository
        run: |
          if [ -n "${PACKAGES_GPG_KEY_PASS:-}" ] && [ -n "${GPG_KEY_ID:-}" ]; then
            echo "$PACKAGES_GPG_KEY_PASS" | \
            gpg \
              --yes \
              --passphrase-fd 0 \
              --pinentry-mode loopback \
              --digest-algo SHA256 \
              --clearsign \
              -u "${GPG_KEY_ID}" \
              -o output/repo/dists/stable/InRelease \
              output/repo/dists/stable/Release
          else
            echo "No GPG signing configured, skipping"
          fi
        env:
          PACKAGES_GPG_KEY_PASS: ${{ secrets.PACKAGES_GPG_KEY_PASS }}
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}

      - name: Deploy stage 1 repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pages
          publish_dir: output/repo
          keep_files: false

  stage2:
    name: Stage 2 - All packages (from hosted repo)
    needs: stage1
    runs-on: ubuntu-26.04

    container:
      image: ghcr.io/termux/package-builder:latest
      options: --privileged --device /dev/fuse

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build stage 2 (with -I from hosted repo)
        run: |
          export AURASTUDIO_REPO="https://arata-labs.github.io/aurastudio-termux"
          bash build.sh -a "${{ inputs.arch }}" -I -e ${{ inputs.stage2_packages }}

      - name: Generate final APT repository
        run: |
          export AURASTUDIO_OUTPUT_DIR="$(pwd)/output"
          export AURASTUDIO_REPO_DIR="$(pwd)/output/repo"
          bash ./generate-apt-repo.sh

      - name: Import GPG key
        run: |
          if [ -n "${PACKAGES_GPG_KEY:-}" ]; then
            echo "$PACKAGES_GPG_KEY" | base64 -d | gpg --batch --import
          else
            echo "No GPG key configured, skipping signing"
          fi
        env:
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}

      - name: Sign repository
        run: |
          if [ -n "${PACKAGES_GPG_KEY_PASS:-}" ] && [ -n "${GPG_KEY_ID:-}" ]; then
            echo "$PACKAGES_GPG_KEY_PASS" | \
            gpg \
              --yes \
              --passphrase-fd 0 \
              --pinentry-mode loopback \
              --digest-algo SHA256 \
              --clearsign \
              -u "${GPG_KEY_ID}" \
              -o output/repo/dists/stable/InRelease \
              output/repo/dists/stable/Release
          else
            echo "No GPG signing configured, skipping"
          fi
        env:
          PACKAGES_GPG_KEY_PASS: ${{ secrets.PACKAGES_GPG_KEY_PASS }}
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}

      - name: Deploy final repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pages
          publish_dir: output/repo
          keep_files: false
