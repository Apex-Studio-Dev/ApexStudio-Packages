name: Build Packages

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        required: true
        default: "aarch64"
        type: choice
        options:
          - aarch64
          - arm
          - both
      packages:
        description: "Package names (space-separated)"
        required: true
        type: string
      free-space:
        description: "Free disk space (for large packages)"
        type: boolean
        default: false
      keep-going:
        description: "Skip failed packages, continue building others"
        type: boolean
        default: true
      install-deps:
        description: "Install dependencies from hosted repo before building (-I flag)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.arch == 'both' && '["aarch64", "arm"]' || format('["{0}"]', inputs.arch)) }}

    container:
      image: ghcr.io/termux/package-builder:latest
      options: --privileged --device /dev/fuse

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Gather build info
        id: build-info
        run: |
          PACKAGES="${{ inputs.packages }}"
          echo "Packages: $PACKAGES"

          FREE_SPACE="${{ inputs.free-space }}"
          BIG_PKGS="gradle openjdk-17 openjdk-21 libllvm-static"
          for pkg in $PACKAGES; do
            for big in $BIG_PKGS; do
              if [ "$pkg" = "$big" ]; then
                FREE_SPACE="true"
                break 2
              fi
            done
          done
          echo "free_space=$FREE_SPACE" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        if: steps.build-info.outputs.free_space == 'true'
        run: |
          chmod +x scripts/free-space.sh
          CI=true bash scripts/free-space.sh

      # zram skipped — kernel headers not available on GitHub Actions runners
      # Use free-space.sh instead for disk cleanup

      - name: Lint packages
        run: |
          chmod +x scripts/lint-packages.sh
          PKG_SCRIPTS=""
          MISSING=""
          for pkg in ${{ inputs.packages }}; do
            if [ -f "termux-packages/packages/${pkg}/build.sh" ]; then
              PKG_SCRIPTS="${PKG_SCRIPTS} termux-packages/packages/${pkg}/build.sh"
            else
              MISSING="${MISSING} ${pkg}"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "ERROR: Packages not found:${MISSING}"
            echo "Available packages:"
            ls termux-packages/packages/ | head -20
            exit 1
          fi
          if [ -n "$PKG_SCRIPTS" ]; then
            bash scripts/lint-packages.sh $PKG_SCRIPTS
          fi

      - name: Dry-run check
        run: |
          chmod +x scripts/build-package-dry-run-simulation.sh
          scripts/build-package-dry-run-simulation.sh -a "${{ matrix.arch }}" ${{ inputs.packages }}
          RESULT=$?
          if [ "$RESULT" -eq 85 ]; then
            echo "No packages to build for ${{ matrix.arch }}"
          elif [ "$RESULT" -ne 0 ]; then
            echo "ERROR: Dry-run check failed with exit code $RESULT"
            exit $RESULT
          fi

      - name: Generate cache key
        id: cache-key
        run: |
          PACKAGES_HASH=$(md5sum packages.sh | cut -d' ' -f1 | cut -c1-8)
          PATCHES_HASH=$(find patches/ -type f | sort | xargs md5sum 2>/dev/null | md5sum | cut -d' ' -f1 | cut -c1-8)
          CACHE_KEY="termux-build-${{ matrix.arch }}-${PACKAGES_HASH}-${PATCHES_HASH}"
          echo "key=${CACHE_KEY}" >> "$GITHUB_OUTPUT"
          echo "Cache key: ${CACHE_KEY}"

      - name: Restore cached packages
        if: always()
        id: cache-packages
        uses: actions/cache/restore@v6
        with:
          path: |
            /data
            /github/home/.termux-build
            output/${{ matrix.arch }}
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            termux-build-${{ matrix.arch }}-

      - name: Check cache hit
        run: |
          echo "Cache hit: ${{ steps.cache-packages.outputs.cache-hit }}"
          ls output/${{ matrix.arch }}/ 2>/dev/null | head -10 || echo "output/${{ matrix.arch }} empty"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK r29
        run: |
          if [ ! -d /github/home/lib/android-ndk-r29 ]; then
            curl -L "https://dl.google.com/android/repository/android-ndk-r29-linux.zip" -o /tmp/ndk.zip
            unzip -q /tmp/ndk.zip -d /github/home/lib/
          else
            echo "NDK r29 already installed"
          fi

      - name: Build packages
        run: |
          export ANDROID_NDK_HOME=/github/home/lib/android-ndk-r29
          export NDK=/github/home/lib/android-ndk-r29

          rm -f "output/${{ matrix.arch }}/failed-packages.txt"

          BUILD_FLAGS=""
          if [ "${{ inputs.keep-going }}" = "true" ]; then
            BUILD_FLAGS="${BUILD_FLAGS} --keep-going"
          fi
          if [ "${{ inputs.install-deps }}" = "true" ]; then
            BUILD_FLAGS="${BUILD_FLAGS} -I"
          fi
          bash build.sh -a "${{ matrix.arch }}" $BUILD_FLAGS -e ${{ inputs.packages }}

      - name: Save built packages cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            /data
            /github/home/.termux-build
            output/${{ matrix.arch }}
          key: ${{ steps.cache-packages.outputs.cache-primary-key }}

      - name: Show build summary
        if: always()
        run: |
          echo "=== Debs built ==="
          find output -name "*.deb" -type f 2>/dev/null | wc -l
          echo "=== Failed packages ==="
          cat output/${{ matrix.arch }}/failed-packages.txt 2>/dev/null || echo "none"
          echo "=== Build log tail ==="
          tail -30 output/${{ matrix.arch }}/build.log 2>/dev/null || echo "no log"

      - name: Package debs
        if: always()
        run: |
          cd output/${{ matrix.arch }}
          DEB_COUNT=$(find . -name "*.deb" -type f 2>/dev/null | wc -l)
          if [ "$DEB_COUNT" -gt 0 ]; then
            for f in *.deb; do
              newname=$(echo "$f" | tr ':' 'COLON')
              [ "$f" != "$newname" ] && mv "$f" "$newname"
            done
            zip -0 ../packages-${{ matrix.arch }}.zip *.deb
          else
            echo "No debs to package"
          fi

      - name: Delete old release tag
        run: |
          curl -X DELETE \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/packages-${{ matrix.arch }} || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: packages-${{ matrix.arch }}
          name: Packages Build ${{ matrix.arch }}
          files: output/packages-${{ matrix.arch }}.zip
          fail_on_unmatched_files: false
          overwrite_files: true
          overwrite: true

      - name: Send build notification
        if: always()
        run: |
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram not configured, skipping"
            exit 0
          fi

          DEB_COUNT=$(find output -name "*.deb" -type f 2>/dev/null | wc -l)
          FAILED_COUNT=0
          FAILED_LIST=""
          if [ -f "output/${{ matrix.arch }}/failed-packages.txt" ]; then
            FAILED_COUNT=$(wc -l < "output/${{ matrix.arch }}/failed-packages.txt")
            FAILED_LIST=$(cat "output/${{ matrix.arch }}/failed-packages.txt" | tr '\n' ', ' | sed 's/,$//')
          fi

          if [ "$FAILED_COUNT" -gt 0 ]; then
            STATUS="PARTIAL (${DEB_COUNT} built, ${FAILED_COUNT} failed)"
          else
            STATUS="SUCCESS (${DEB_COUNT} built)"
          fi

          MSG=$(printf "AuraStudio Build\nPackages: %s\nArch: %s\nStatus: %s\nFailed: %s\nRun: https://github.com/%s/actions/runs/%s" \
            "${{ inputs.packages }}" "${{ matrix.arch }}" "$STATUS" "$FAILED_LIST" "${GITHUB_REPOSITORY}" "${{ github.run_id }}")

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="$CHAT_ID" \
            --data-urlencode "text=$MSG" || true

          LOG_FILE="output/${{ matrix.arch }}/build.log"
          if [ -f "$LOG_FILE" ]; then
            gzip -k -f "$LOG_FILE"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F chat_id="$CHAT_ID" \
              -F document=@"${LOG_FILE}.gz" \
              -F caption="Build log ${{ matrix.arch }}" || true
            rm -f "${LOG_FILE}.gz"
          fi

  publish:
    needs: build
    runs-on: ubuntu-26.04

    env:
      GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download existing debs from hosted repo
        run: |
          echo "=== Downloading existing packages from hosted repo ==="
          REPO_URL="https://arata-labs.github.io/aurastudio-termux"
          BUILD_PACKAGES="${{ inputs.packages }}"

          for arch in aarch64 arm; do
            mkdir -p "output/${arch}"
            # Download from both binary-${arch} and binary-all
            for bin_arch in "${arch}" "all"; do
              PACKAGES_URL="${REPO_URL}/dists/stable/main/binary-${bin_arch}/Packages"
              if curl -sL "$PACKAGES_URL" -o "/tmp/Packages-${bin_arch}" 2>/dev/null; then
                echo "Downloaded Packages file for binary-${bin_arch}"
                grep "^Filename:" "/tmp/Packages-${bin_arch}" | sed 's|Filename: ||' | while read -r deb_path; do
                  deb_name=$(basename "$deb_path")
                  # Skip packages we're building (they'll be replaced by new version)
                  SKIP=false
                  for pkg in $BUILD_PACKAGES; do
                    if echo "$deb_name" | grep -qE "^${pkg}_"; then
                      SKIP=true
                      break
                    fi
                  done
                  # Skip if Filename is a release URL (handled by handle-large-debs.sh)
                  if echo "$deb_path" | grep -qE "^https?://"; then
                    echo "Skipping $deb_name (release URL, handled by handle-large-debs.sh)"
                    continue
                  fi
                  if [ "$SKIP" = "false" ]; then
                    deb_url="${REPO_URL}/${deb_path}"
                    curl -sL "$deb_url" -o "output/${arch}/${deb_name}" 2>/dev/null || true
                  fi
                done
              else
                echo "No Packages file for binary-${bin_arch} (first build?)"
              fi
            done
            EXISTING=$(find "output/${arch}" -name "*.deb" -type f 2>/dev/null | wc -l)
            echo "Existing debs for $arch: $EXISTING"
          done

      - name: Download from Release
        run: |
          INPUT_ARCH="${{ inputs.arch }}"
          if [ "$INPUT_ARCH" = "both" ]; then
            DOWNLOAD_ARCHS="aarch64 arm"
          else
            DOWNLOAD_ARCHS="$INPUT_ARCH"
          fi

          for arch in $DOWNLOAD_ARCHS; do
            mkdir -p "output/${arch}"
            for attempt in 1 2 3; do
              echo "Download attempt $attempt/3 for $arch..."
              if gh release download "packages-${arch}" \
                --pattern "packages-${arch}.zip" \
                --dir "output/${arch}" 2>/dev/null; then
                echo "Download succeeded for $arch"
                cd "output/${arch}"
                unzip -o "packages-${arch}.zip" 2>/dev/null || true
                rm -f "packages-${arch}.zip"
                echo "Unzipped $(find . -name '*.deb' -type f | wc -l) debs for $arch"
                cd -
                break
              fi
              echo "Attempt $attempt failed for $arch, waiting 30s..."
              sleep 30
            done
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gnupg curl wget python3 apt-utils

      - name: Cleanup broken/empty deb files
        run: |
          echo "=== Cleaning up broken symlinks and empty files ==="
          for arch in aarch64 arm; do
            if [ -d "output/${arch}" ]; then
              # Remove broken symlinks
              find "output/${arch}" -type l ! -exec test -e {} \; -delete 2>/dev/null || true
              # Remove empty files
              find "output/${arch}" -type f -empty -delete 2>/dev/null || true
              # Remove files < 1KB (likely corrupted downloads)
              find "output/${arch}" -name "*.deb" -type f -size -1k -delete 2>/dev/null || true
              REMAINING=$(find "output/${arch}" -name "*.deb" -type f 2>/dev/null | wc -l)
              echo "Remaining debs for $arch: $REMAINING"
            fi
          done

      - name: Generate APT repository
        run: |
          export AURASTUDIO_OUTPUT_DIR="$(pwd)/output"
          export AURASTUDIO_REPO_DIR="$(pwd)/output/repo"
          bash ./generate-apt-repo.sh

      - name: Import GPG key
        run: |
          if [ -n "${PACKAGES_GPG_KEY:-}" ]; then
            echo "$PACKAGES_GPG_KEY" | base64 -d | gpg --batch --import
          fi
          if gpg --list-secret-keys "5F128F230DEEF535" &>/dev/null; then
            echo "AuraStudio Builder key available"
          else
            gpg --batch --import aurastudio.gpg
          fi
        env:
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}

      - name: Sign repository
        run: |
          KEY_ID="5F128F230DEEF535"
          if [ -n "${GPG_KEY_ID:-}" ]; then
            KEY_ID="${GPG_KEY_ID}"
          fi
          echo "Signing with key: $KEY_ID"
          gpg --batch --yes --pinentry-mode loopback --digest-algo SHA256 \
            --clearsign -u "${KEY_ID}" \
            -o output/repo/dists/stable/InRelease \
            output/repo/dists/stable/Release
          gpg --batch --yes --pinentry-mode loopback --digest-algo SHA256 \
            -u "${KEY_ID}" \
            --detach-sign \
            -o output/repo/dists/stable/Release.gpg \
            output/repo/dists/stable/Release
          echo "Repository signed successfully"
        env:
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}

      - name: Handle large debs (>100MB → GitHub Releases)
        run: |
          export GITHUB_REPOSITORY="${{ github.repository }}"
          bash ./handle-large-debs.sh output/repo 100
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate packages.json
        run: |
          bash ./generate-packages-json.sh \
            "output/repo/packages.json" \
            "output/repo/dists/stable/main/binary-aarch64/Packages" \
            "output/repo/dists/stable/main/binary-arm/Packages" \
            "output/repo/dists/stable/main/binary-all/Packages"

      - name: Copy website
        run: |
          cp pages-index.html output/repo/index.html

      - name: Deploy to pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pages
          publish_dir: output/repo
          keep_files: false

      - name: Publish summary
        if: always()
        run: |
          DEB_COUNT=$(find output/repo -path "*/binary-*/*.deb" -type f 2>/dev/null | wc -l)
          echo "Published ${DEB_COUNT} debs to APT repo"
