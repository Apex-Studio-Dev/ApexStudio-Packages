name: Build & Publish Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Package names (space-separated, e.g. 'bash coreutils apt')"
        required: true
        type: string
      rebuild-index:
        description: "Rebuild APT index after build"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pages: write

env:
  TERMUX_BUILDER_IMAGE_NAME: ghcr.io/termux/package-builder:latest

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout aurastudio-termux
        uses: actions/checkout@v7
        with:
          repository: Arata-Labs/aurastudio-termux
          submodules: recursive
          path: aurastudio-termux

      - name: Checkout aurastudio-packages
        uses: actions/checkout@v7
        with:
          repository: Arata-Labs/aurastudio-packages
          path: aurastudio-packages

      - name: Install APT indexing tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Apply patches
        run: |
          cd aurastudio-termux
          chmod +x build.sh
          ./build.sh -n

      - name: Build packages via Docker
        run: |
          cd aurastudio-termux/termux-packages
          chmod +x scripts/run-docker.sh build-package.sh
          mkdir -p output/aarch64
          ./scripts/run-docker.sh \
            ./build-package.sh -C -a aarch64 -o output/aarch64 \
            ${{ github.event.inputs.packages }} \
            2>&1 | tee output/aarch64/build.log

      - name: Import debs to APT repo
        run: |
          chmod +x aurastudio-packages/scripts/import-debs.sh
          chmod +x aurastudio-packages/scripts/generate-index.sh
          find aurastudio-termux/termux-packages/output/aarch64 -name "*.deb" -type f 2>/dev/null | head -20 || echo "No debs found"
          ./aurastudio-packages/scripts/import-debs.sh \
            aurastudio-termux/termux-packages/output/aarch64

      - name: Rebuild APT index + website data
        if: ${{ github.event.inputs.rebuild-index == 'true' }}
        run: |
          cd aurastudio-packages
          ./scripts/generate-index.sh
          ./scripts/generate-packages-json.sh

      - name: Push to aurastudio-packages
        run: |
          cd aurastudio-packages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: add packages — ${{ github.event.inputs.packages }}"
            git push
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ github.sha }}
          path: aurastudio-termux/termux-packages/output/aarch64/build.log
          retention-days: 7
