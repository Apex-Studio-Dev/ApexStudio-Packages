name: Build Packages

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        required: true
        default: "aarch64"
        type: choice
        options:
          - aarch64
      packages:
        description: "Package names (space-separated, or 'all' for base packages)"
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-26.04

    container:
      image: ghcr.io/termux/package-builder:latest
      options: --privileged --device /dev/fuse

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache built packages
        if: always()
        id: cache-packages
        uses: actions/cache@v4
        with:
          path: |
            /data
            /github/home/.termux-build
            output/${{ inputs.arch }}
          key: termux-build-${{ inputs.arch }}-${{ github.sha }}
          restore-keys: |
            termux-build-${{ inputs.arch }}-
          save-always: true

      - name: Check cache hit
        run: |
          echo "Cache hit: ${{ steps.cache-packages.outputs.cache-hit }}"
          ls output/${{ inputs.arch }}/ 2>/dev/null | head -10 || echo "output/${{ inputs.arch }} empty"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK r29
        run: |
          if [ ! -d /github/home/lib/android-ndk-r29 ]; then
            curl -L "https://dl.google.com/android/repository/android-ndk-r29-linux.zip" -o /tmp/ndk.zip
            unzip -q /tmp/ndk.zip -d /github/home/lib/
          else
            echo "NDK r29 already installed"
          fi

      - name: Build packages
        run: |
          export ANDROID_NDK_HOME=/github/home/lib/android-ndk-r29
          export NDK=/github/home/lib/android-ndk-r29

          if [ "${{ inputs.packages }}" = "all" ]; then
            bash build.sh -a "${{ inputs.arch }}"
          else
            bash build.sh -a "${{ inputs.arch }}" -e ${{ inputs.packages }}
          fi

      - name: Save built packages cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            /data
            /github/home/.termux-build
            output/${{ inputs.arch }}
          key: termux-build-${{ inputs.arch }}-${{ github.sha }}

      - name: Show build log
        if: always()
        run: cat output/${{ inputs.arch }}/build.log 2>/dev/null || echo "no log"

      - name: Debug debs location
        if: always()
        run: |
          echo "=== output structure ==="
          find output -name "*.deb" -type f | head -50
          echo "=== all debs ==="
          find . -name "*.deb" -not -path "./.git/*" | head -30

      - name: Send Telegram notification
        if: always()
        run: |
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ] && echo "Telegram not configured, skipping" && exit 0

          if [ "${{ job.status }}" = "success" ]; then
            STATUS="SUCCESS"
          else
            STATUS="FAILED"
          fi

          DEB_COUNT=$(find output -name "*.deb" -type f 2>/dev/null | wc -l)
          BUILD_LOG="output/${{ inputs.arch }}/build.log"

          MSG=$(printf "AuraStudio Build\nPackages: %s\nArch: %s\nStatus: %s\nDebs built: %s\nRun: https://github.com/%s/actions/runs/%s" \
            "${{ inputs.packages }}" "${{ inputs.arch }}" "$STATUS" "$DEB_COUNT" "${GITHUB_REPOSITORY}" "${{ github.run_id }}")

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="$CHAT_ID" \
            --data-urlencode "text=$MSG" || true

          if [ -f "$BUILD_LOG" ]; then
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F chat_id="$CHAT_ID" \
              -F document=@"$BUILD_LOG" \
              -F caption="Build log - ${{ inputs.packages }}" || true
          fi

      - name: Package debs
        if: success()
        run: |
          cd output/${{ inputs.arch }}
          for f in *.deb; do
            newname=$(echo "$f" | tr ':' 'COLON')
            [ "$f" != "$newname" ] && mv "$f" "$newname"
          done
          zip -0 ../packages-${{ inputs.arch }}.zip *.deb

      - name: Delete old release tag
        run: |
          curl -X DELETE \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/packages-${{ inputs.arch }} || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: packages-${{ inputs.arch }}
          name: Packages Build ${{ inputs.arch }}
          files: output/packages-${{ inputs.arch }}.zip
          fail_on_unmatched_files: false
          overwrite_files: true
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-26.04

    env:
      GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: pages
          fetch-depth: 0

      - name: Download from Release
        run: |
          mkdir -p output/${{ inputs.arch }}
          gh release download packages-${{ inputs.arch }} \
            --pattern "packages-${{ inputs.arch }}.zip" --dir output/${{ inputs.arch }} || true
          cd output/${{ inputs.arch }}
          if [ -f "packages-${{ inputs.arch }}.zip" ]; then
            unzip -o packages-${{ inputs.arch }}.zip
            rm packages-${{ inputs.arch }}.zip
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gnupg curl wget python3

      - name: Generate APT repository
        run: |
          export AURASTUDIO_OUTPUT_DIR="$(pwd)/output"
          export AURASTUDIO_REPO_DIR="$(pwd)/output/repo"
          bash ./generate-apt-repo.sh

      - name: Import GPG key
        run: |
          if [ -n "${PACKAGES_GPG_KEY:-}" ]; then
            echo "$PACKAGES_GPG_KEY" | base64 -d | gpg --batch --import
          else
            echo "No GPG key configured, skipping signing"
          fi
        env:
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}

      - name: Sign repository
        run: |
          if [ -n "${PACKAGES_GPG_KEY_PASS:-}" ] && [ -n "${GPG_KEY_ID:-}" ]; then
            echo "$PACKAGES_GPG_KEY_PASS" | \
            gpg \
              --yes \
              --passphrase-fd 0 \
              --pinentry-mode loopback \
              --digest-algo SHA256 \
              --clearsign \
              -u "${GPG_KEY_ID}" \
              -o output/repo/dists/stable/InRelease \
              output/repo/dists/stable/Release
          else
            echo "No GPG signing configured, skipping"
          fi
        env:
          PACKAGES_GPG_KEY_PASS: ${{ secrets.PACKAGES_GPG_KEY_PASS }}
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}

      - name: Generate packages.json
        run: |
          PACKAGES_FILE="output/repo/dists/stable/main/binary-aarch64/Packages"
          bash ./generate-packages-json.sh "$PACKAGES_FILE" "output/repo/packages.json"

      - name: Copy website
        run: |
          cp pages-index.html output/repo/index.html

      - name: Deploy to pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pages
          publish_dir: output/repo
          keep_files: false

      - name: Send publish notification
        if: always()
        run: |
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ] && exit 0

          if [ "${{ job.status }}" = "success" ]; then
            MSG=$(printf "Published to APT repo\nPackages: %s\nHosted at: https://arata-labs.github.io/aurastudio-termux" "${{ inputs.packages }}")
          else
            MSG=$(printf "Publish FAILED\nPackages: %s\nCheck: https://github.com/%s/actions/runs/%s" \
              "${{ inputs.packages }}" "${GITHUB_REPOSITORY}" "${{ github.run_id }}")
          fi

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="$CHAT_ID" \
            --data-urlencode "text=$MSG" || true
