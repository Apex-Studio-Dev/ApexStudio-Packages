name: Publish APT Repository

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-26.04

    env:
      GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download existing debs from hosted repo
        run: |
          echo "=== Downloading ALL existing packages from hosted repo ==="
          REPO_URL="https://arata-labs.github.io/aurastudio-termux"

          # Download binary-all once (shared across architectures)
          mkdir -p "output/all"
          PACKAGES_ALL_URL="${REPO_URL}/dists/stable/main/binary-all/Packages"
          if curl -sL "$PACKAGES_ALL_URL" -o "/tmp/Packages-all" 2>/dev/null; then
            echo "Downloaded Packages file for binary-all"
            grep "^Filename:" "/tmp/Packages-all" | sed 's|Filename: ||' | while read -r deb_path; do
              deb_name=$(basename "$deb_path")
              # Handle release URLs
              if echo "$deb_path" | grep -qE "^https?://"; then
                echo "Downloading from release URL: $deb_name"
                curl -sL --fail "$deb_path" -o "output/all/${deb_name}" 2>/dev/null || {
                  echo "ERROR: Failed to download $deb_name from release URL"
                  exit 1
                }
                FILE_SIZE=$(stat -c%s "output/all/${deb_name}" 2>/dev/null || echo "0")
                if [ "$FILE_SIZE" -lt 1024 ]; then
                  echo "ERROR: $deb_name too small (${FILE_SIZE} bytes)"
                  exit 1
                fi
                continue
              fi
              curl -sL "${REPO_URL}/${deb_path}" -o "output/all/${deb_name}" 2>/dev/null || true
            done
          else
            echo "No Packages file for binary-all (first build?)"
          fi
          ALL_COUNT=$(find "output/all" -name "*.deb" -type f 2>/dev/null | wc -l)
          echo "Existing debs for all: $ALL_COUNT"

          # Download binary-${arch} for each architecture
          for arch in aarch64 arm; do
            mkdir -p "output/${arch}"
            PACKAGES_URL="${REPO_URL}/dists/stable/main/binary-${arch}/Packages"
            if curl -sL "$PACKAGES_URL" -o "/tmp/Packages-${arch}" 2>/dev/null; then
              echo "Downloaded Packages file for binary-${arch}"
              grep "^Filename:" "/tmp/Packages-${arch}" | sed 's|Filename: ||' | while read -r deb_path; do
                deb_name=$(basename "$deb_path")
                # Handle release URLs
                if echo "$deb_path" | grep -qE "^https?://"; then
                  echo "Downloading from release URL: $deb_name"
                  curl -sL --fail "$deb_path" -o "output/${arch}/${deb_name}" 2>/dev/null || {
                    echo "ERROR: Failed to download $deb_name from release URL"
                    exit 1
                  }
                  FILE_SIZE=$(stat -c%s "output/${arch}/${deb_name}" 2>/dev/null || echo "0")
                  if [ "$FILE_SIZE" -lt 1024 ]; then
                    echo "ERROR: $deb_name too small (${FILE_SIZE} bytes)"
                    exit 1
                  fi
                  continue
                fi
                curl -sL "${REPO_URL}/${deb_path}" -o "output/${arch}/${deb_name}" 2>/dev/null || true
              done
            else
              echo "No Packages file for binary-${arch} (first build?)"
            fi
            EXISTING=$(find "output/${arch}" -name "*.deb" -type f 2>/dev/null | wc -l)
            echo "Existing debs for $arch: $EXISTING"
          done

      - name: Download from Release
        run: |
          for arch in aarch64 arm; do
            mkdir -p "output/${arch}"
            # Check if release exists
            if ! gh release view "packages-${arch}" &>/dev/null 2>&1; then
              echo "Release packages-${arch} does not exist yet, skipping"
              continue
            fi
            DOWNLOAD_SUCCESS=false
            for attempt in 1 2 3; do
              echo "Download attempt $attempt/3 for $arch..."
              if gh release download "packages-${arch}" \
                --pattern "packages-${arch}.zip" \
                --dir "output/${arch}" 2>/dev/null; then
                echo "Download succeeded for $arch"
                cd "output/${arch}"
                unzip -o "packages-${arch}.zip" 2>/dev/null || true
                rm -f "packages-${arch}.zip"
                echo "Unzipped $(find . -name '*.deb' -type f | wc -l) debs for $arch"
                cd -
                DOWNLOAD_SUCCESS=true
                break
              fi
              echo "Attempt $attempt failed for $arch, waiting 30s..."
              sleep 30
            done
            if [ "$DOWNLOAD_SUCCESS" = "false" ]; then
              echo "ERROR: Failed to download packages-${arch} from Release after 3 attempts"
              exit 1
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prefer newly rebuilt packages over hosted duplicates
        run: |
          # Debs rebuilt in CI (packages-<arch> release zips) must win over
          # duplicates downloaded from the hosted repo (output/all). This matters
          # for *_all debs like termux-keyring: the hosted copy contains the OLD
          # leaked signing key and must not be re-published.
          for arch in aarch64 arm; do
            if [ -d "output/${arch}" ]; then
              find "output/${arch}" -maxdepth 1 -name "*_all.deb" -type f 2>/dev/null | while read -r deb; do
                basename=$(basename "$deb")
                if [ -f "output/all/${basename}" ]; then
                  echo "Replacing hosted ${basename} with rebuilt version"
                  rm -f "output/all/${basename}"
                fi
              done
            fi
          done

      - name: Verify termux-keyring uses signing key v2
        run: |
          DEBS=$(find output -name "termux-keyring_*_all.deb" -type f 2>/dev/null)
          if [ -z "${DEBS}" ]; then
            echo "ERROR: no termux-keyring deb found in output/" >&2
            exit 1
          fi
          LEAKED=0
          HAS_V2=0
          for KEYDEB in $DEBS; do
            EXTRACT=$(mktemp -d)
            dpkg-deb -x "$KEYDEB" "$EXTRACT"
            if grep -rq "AuraStudio Builder <build@aurastudio.dev>" "$EXTRACT"; then
              echo "WARN: $KEYDEB still embeds the LEAKED signing key (AuraStudio Builder)"
              LEAKED=1
            fi
            if grep -rq "AuraStudio Builder v2" "$EXTRACT"; then
              echo "OK: $KEYDEB embeds signing key v2"
              HAS_V2=1
            fi
            rm -rf "$EXTRACT"
          done
          if [ "${LEAKED}" = "1" ] && [ "${HAS_V2}" = "1" ]; then
            echo "ERROR: both old (leaked) and new keyring debs present." >&2
            echo "Force a clean rebuild: ./build.sh -a aarch64 -e termux-keyring -f" >&2
            exit 1
          fi
          if [ "${HAS_V2}" != "1" ]; then
            echo "ERROR: no termux-keyring deb contains the v2 public key." >&2
            echo "Rebuild termux-keyring first: ./build.sh -a aarch64 -e termux-keyring -f" >&2
            exit 1
          fi
          echo "Verify passed: published binary-all will embed signing key v2"

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gnupg curl wget python3 apt-utils dpkg-dev

      - name: Cleanup broken/empty deb files
        run: |
          echo "=== Cleaning up broken symlinks and empty files ==="
          for arch in aarch64 arm; do
            if [ -d "output/${arch}" ]; then
              # Remove broken symlinks
              find "output/${arch}" -type l ! -exec test -e {} \; -delete 2>/dev/null || true
              # Remove empty files
              find "output/${arch}" -type f -empty -delete 2>/dev/null || true
              # Remove files < 1KB (likely corrupted downloads)
              find "output/${arch}" -name "*.deb" -type f -size -1k -delete 2>/dev/null || true
              REMAINING=$(find "output/${arch}" -name "*.deb" -type f 2>/dev/null | wc -l)
              echo "Remaining debs for $arch: $REMAINING"
            fi
          done

      - name: Generate APT repository
        run: |
          export AURASTUDIO_OUTPUT_DIR="$(pwd)/output"
          export AURASTUDIO_REPO_DIR="$(pwd)/output/repo"
          bash ./generate-apt-repo.sh

      - name: Import GPG key
        run: |
          if [ -z "${PACKAGES_GPG_KEY:-}" ]; then
            echo "ERROR: secrets.PACKAGES_GPG_KEY not set (base64 of AuraStudio signing v2 secret key)" >&2
            exit 1
          fi
          echo "$PACKAGES_GPG_KEY" | base64 -d | gpg --batch --import
        env:
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}

      - name: Sign repository
        run: |
          KEY_ID="6D81A8C48CD43B73"
          if [ -n "${GPG_KEY_ID:-}" ]; then
            KEY_ID="${GPG_KEY_ID}"
          fi
          echo "Signing with key: $KEY_ID"
          gpg --batch --yes --pinentry-mode loopback --digest-algo SHA256 \
            --clearsign -u "${KEY_ID}" \
            -o output/repo/dists/stable/InRelease \
            output/repo/dists/stable/Release
          gpg --batch --yes --pinentry-mode loopback --digest-algo SHA256 \
            -u "${KEY_ID}" \
            --detach-sign \
            -o output/repo/dists/stable/Release.gpg \
            output/repo/dists/stable/Release
          echo "Repository signed successfully"
        env:
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}

      - name: Handle large debs (>100MB → GitHub Releases)
        run: |
          export GITHUB_REPOSITORY="${{ github.repository }}"
          bash ./handle-large-debs.sh output/repo 100
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate packages.json
        run: |
          bash ./generate-packages-json.sh \
            "output/repo/packages.json" \
            "output/repo/dists/stable/main/binary-aarch64/Packages" \
            "output/repo/dists/stable/main/binary-arm/Packages" \
            "output/repo/dists/stable/main/binary-all/Packages"

      - name: Copy website
        run: |
          cp pages-index.html output/repo/index.html

      - name: Deploy to pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pages
          publish_dir: output/repo
          keep_files: false

      - name: Publish summary
        if: always()
        run: |
          DEB_COUNT=$(find output/repo -path "*/binary-*/*.deb" -type f 2>/dev/null | wc -l)
          echo "Published ${DEB_COUNT} debs to APT repo"

      - name: Send notification
        if: always()
        run: |
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            exit 0
          fi

          DEB_COUNT=$(find output/repo -path "*/binary-*/*.deb" -type f 2>/dev/null | wc -l)

          MSG=$(printf "AuraStudio Publish (manual)\nPublished: %s debs (aarch64 + arm + all)\nRepo: https://arata-labs.github.io/aurastudio-termux\nRun: https://github.com/%s/actions/runs/%s" \
            "$DEB_COUNT" "${GITHUB_REPOSITORY}" "${{ github.run_id }}")

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="$CHAT_ID" \
            --data-urlencode "text=$MSG" || true
