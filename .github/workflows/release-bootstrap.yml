name: Release Bootstrap

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  TERMUX_BUILDER_IMAGE_NAME: ghcr.io/termux/package-builder:latest

jobs:
  build-and-release:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Apply patches
        run: |
          chmod +x build.sh
          ./build.sh -n

      - name: Build bootstrap via Docker
        run: |
          cd termux-packages
          chmod +x scripts/run-docker.sh scripts/build-bootstraps.sh
          ./scripts/run-docker.sh \
            ./scripts/build-bootstraps.sh \
            --architectures aarch64

      - name: Calculate SHA-256
        id: sha
        run: |
          SHA=$(sha256sum termux-packages/bootstrap-aarch64.zip | cut -d' ' -f1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "SHA-256: $SHA"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.event.inputs.tag }} \
            --title "Bootstrap ${{ github.event.inputs.tag }}" \
            --notes "Bootstrap archive for AuraStudio (aarch64)

          SHA-256: \`${{ steps.sha.outputs.sha256 }}\`

          Update \`build.gradle.kts\` with this SHA-256." \
            termux-packages/bootstrap-aarch64.zip

      - name: Print update instructions
        run: |
          echo "========================================="
          echo "Update aurastudio-app/app/build.gradle.kts:"
          echo "  PLACEHOLDER_SHA256_AARCH64 = \"${{ steps.sha.outputs.sha256 }}\""
          echo "========================================="
