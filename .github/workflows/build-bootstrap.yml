name: Build Bootstrap (aarch64)

on:
  workflow_dispatch:
    inputs:
      method:
        description: "Build method"
        required: true
        type: choice
        options:
          - from-source
          - from-repo
        default: from-source

permissions:
  contents: write
  pages: write

concurrency:
  group: build-bootstrap-${{ github.ref }}
  cancel-in-progress: true

env:
  TERMUX_BUILDER_IMAGE_NAME: ghcr.io/termux/package-builder:latest

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout aurastudio-termux
        uses: actions/checkout@v7
        with:
          repository: Arata-Labs/aurastudio-termux
          submodules: recursive
          path: aurastudio-termux

      - name: Checkout aurastudio-packages
        uses: actions/checkout@v7
        with:
          repository: Arata-Labs/aurastudio-packages
          path: aurastudio-packages
          token: ${{ secrets.REPO_PAT }}

      - name: Install APT indexing tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Apply patches
        run: |
          cd aurastudio-termux
          chmod +x build.sh
          ./build.sh -n

      - name: Build all bootstrap packages from source (~2-4 hours)
        if: ${{ github.event.inputs.method == 'from-source' }}
        run: |
          cd aurastudio-termux/termux-packages
          chmod +x scripts/run-docker.sh build-package.sh

          # Get all bootstrap packages from packages.sh
          source ../packages.sh
          echo "=== Building packages: ${AURASTUDIO_PACKAGES[*]} ==="

          mkdir -p output/aarch64
          ./scripts/run-docker.sh \
            ./build-package.sh -C -a aarch64 -o output/aarch64 \
            ${AURASTUDIO_PACKAGES[*]} \
            2>&1 | tee output/aarch64/build.log

      - name: Build bootstrap from hosted repo (~5 min)
        if: ${{ github.event.inputs.method == 'from-repo' }}
        run: |
          cd aurastudio-termux/termux-packages
          chmod +x scripts/run-docker.sh scripts/generate-bootstraps.sh
          mkdir -p output/aarch64
          ./scripts/run-docker.sh \
            ./scripts/generate-bootstraps.sh \
            --architectures aarch64 \
            --repository "https://arata-labs.github.io/aurastudio-packages" \
            2>&1 | tee output/aarch64/build.log

      - name: Import all debs to APT repo
        if: ${{ github.event.inputs.method == 'from-source' }}
        run: |
          chmod +x aurastudio-packages/scripts/import-debs.sh
          chmod +x aurastudio-packages/scripts/generate-index.sh

          echo "=== All .deb files ==="
          find aurastudio-termux/termux-packages/output -name "*.deb" -type f 2>/dev/null || echo "none"

          echo "=== Importing from output/aarch64 (requested packages) ==="
          ./aurastudio-packages/scripts/import-debs.sh \
            aurastudio-termux/termux-packages/output/aarch64 || true

          echo "=== Importing from output (dependencies) ==="
          ./aurastudio-packages/scripts/import-debs.sh \
            aurastudio-termux/termux-packages/output || true

      - name: Rebuild APT index + website data
        if: ${{ github.event.inputs.method == 'from-source' }}
        run: |
          cd aurastudio-packages
          ./scripts/generate-index.sh
          ./scripts/generate-packages-json.sh

      - name: Push packages to hosted repo
        if: ${{ github.event.inputs.method == 'from-source' }}
        run: |
          cd aurastudio-packages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: add bootstrap packages — all base + debug"
            git push
          fi

      - name: Show build result
        if: always()
        run: |
          echo "=== Build log (last 80 lines) ==="
          tail -80 aurastudio-termux/termux-packages/output/aarch64/build.log 2>/dev/null || echo "No build log"
          echo "=== Bootstrap files ==="
          ls -lh aurastudio-termux/termux-packages/bootstrap-*.zip 2>/dev/null || echo "No bootstrap zip found"
          echo "=== Deb count ==="
          find aurastudio-termux/termux-packages/output -name "*.deb" -type f 2>/dev/null | wc -l || echo "0"

      - name: Upload bootstrap artifact
        if: success() && github.event.inputs.method == 'from-repo'
        uses: actions/upload-artifact@v6
        with:
          name: bootstrap-aarch64-${{ github.sha }}
          path: aurastudio-termux/termux-packages/bootstrap-*.zip
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ github.sha }}
          path: aurastudio-termux/termux-packages/output/aarch64/build.log
          retention-days: 7
