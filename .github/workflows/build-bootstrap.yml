name: Build Bootstrap (aarch64)

on:
  workflow_dispatch:
    inputs:
      method:
        description: "Build method"
        required: true
        type: choice
        options:
          - from-source
          - from-repo
        default: from-repo

permissions: {}

concurrency:
  group: build-bootstrap-${{ github.ref }}
  cancel-in-progress: true

env:
  TERMUX_BUILDER_IMAGE_NAME: ghcr.io/termux/package-builder:latest

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Apply patches
        run: |
          chmod +x build.sh
          ./build.sh -n

      - name: Build bootstrap (from source — slow, ~2-4 hours)
        if: ${{ github.event.inputs.method == 'from-source' }}
        run: |
          mkdir -p output
          cd termux-packages
          chmod +x scripts/run-docker.sh scripts/build-bootstraps.sh
          ./scripts/run-docker.sh \
            ./scripts/build-bootstraps.sh \
            --architectures aarch64 \
            2>&1 | tee ../output/bootstrap-build.log

      - name: Build bootstrap (from hosted repo — fast, ~5 min)
        if: ${{ github.event.inputs.method == 'from-repo' }}
        run: |
          mkdir -p output
          cd termux-packages
          chmod +x scripts/run-docker.sh scripts/generate-bootstraps.sh
          ./scripts/run-docker.sh \
            ./scripts/generate-bootstraps.sh \
            --architectures aarch64 \
            --repository "https://Arata-Labs.github.io/aurastudio-packages" \
            2>&1 | tee ../output/bootstrap-build.log

      - name: Show build result
        if: always()
        run: |
          echo "=== Build log (last 80 lines) ==="
          tail -80 output/bootstrap-build.log 2>/dev/null || echo "No build log"
          echo "=== Bootstrap files ==="
          ls -lh termux-packages/bootstrap-*.zip 2>/dev/null || echo "No bootstrap zip found"

      - name: Upload bootstrap artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: bootstrap-aarch64-${{ github.sha }}
          path: termux-packages/bootstrap-*.zip
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ github.sha }}
          path: output/bootstrap-build.log
          retention-days: 7
