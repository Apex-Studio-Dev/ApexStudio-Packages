<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraStudio Packages</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      background: #0d0d14;
      color: #e0e0e0;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #6c72cb;
      margin-bottom: 8px;
    }

    .logo span { color: #a855f7; }

    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .stats {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 30px;
    }

    .stat-box {
      background: #16161f;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 12px 24px;
      text-align: center;
    }

    .stat-num {
      font-size: 24px;
      font-weight: 700;
      color: #a855f7;
    }

    .stat-label {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .search-box {
      position: relative;
      margin-bottom: 30px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 40px;
      background: #16161f;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: #6c72cb;
    }

    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
    }

    .search-count {
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
    }

    .pkg-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pkg-item {
      background: #16161f;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s;
    }

    .pkg-item:hover {
      border-color: #6c72cb;
    }

    .pkg-name {
      font-weight: 600;
      color: #e0e0e0;
      font-size: 14px;
    }

    .pkg-desc {
      color: #888;
      font-size: 12px;
      margin-top: 2px;
    }

    .pkg-ver {
      color: #6c72cb;
      font-size: 12px;
      font-family: monospace;
      white-space: nowrap;
    }

    .loading {
      text-align: center;
      color: #666;
      padding: 40px;
    }

    .error {
      text-align: center;
      color: #ef4444;
      padding: 40px;
    }

    .footer {
      text-align: center;
      margin-top: 40px;
      color: #444;
      font-size: 12px;
    }

    .footer a { color: #6c72cb; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    .empty { text-align: center; color: #666; padding: 40px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">Aura<span>Studio</span> Packages</div>
      <div class="subtitle">APT repository for AuraStudio on Termux</div>
    </header>

    <div class="stats">
      <div class="stat-box">
        <div class="stat-num" id="total">-</div>
        <div class="stat-label">Packages</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="arch">aarch64</div>
        <div class="stat-label">Architecture</div>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="search" placeholder="Search packages..." autocomplete="off">
    </div>
    <div class="search-count" id="count"></div>

    <div class="pkg-list" id="list">
      <div class="loading">Loading packages...</div>
    </div>

    <div class="footer">
      Setup: <code>pkg install apt-transport-https &amp;&amp; pkg install ar</code><br><br>
      <a href="https://github.com/Arata-Labs/aurastudio-termux">GitHub</a>
    </div>
  </div>

<script>
let allPackages = [];

async function loadPackages() {
  try {
    const res = await fetch('packages.json');
    if (!res.ok) throw new Error('Not found');
    allPackages = await res.json();
    document.getElementById('total').textContent = allPackages.length;
    render(allPackages);
  } catch (e) {
    document.getElementById('list').innerHTML = '<div class="error">packages.json not found.<br>Run the workflow first.</div>';
  }
}

function render(pkgs) {
  const list = document.getElementById('list');
  const count = document.getElementById('count');

  if (pkgs.length === 0) {
    list.innerHTML = '<div class="empty">No packages found</div>';
    count.textContent = '';
    return;
  }

  count.textContent = `Showing ${pkgs.length} of ${allPackages.length} packages`;

  list.innerHTML = pkgs.map(p => `
    <div class="pkg-item">
      <div>
        <div class="pkg-name">${p.name}</div>
        ${p.desc ? `<div class="pkg-desc">${p.desc}</div>` : ''}
      </div>
      <div class="pkg-ver">${p.version || ''}</div>
    </div>
  `).join('');
}

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  if (!q) { render(allPackages); return; }
  render(allPackages.filter(p =>
    p.name.toLowerCase().includes(q) ||
    (p.desc && p.desc.toLowerCase().includes(q))
  ));
});

loadPackages();
</script>
</body>
</html>
